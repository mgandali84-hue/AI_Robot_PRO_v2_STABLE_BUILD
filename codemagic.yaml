workflows:
  android-release:
    name: AI Robot PRO v2 - Android Release APK
    max_build_duration: 60

    environment:
      flutter: 3.35.0
      java: 17

    scripts:
      - name: Clean
        script: |
          flutter clean
          rm -rf android/.gradle
          rm -rf ~/.gradle/caches

      - name: Get packages
        script: |
          flutter pub get

      - name: Analyze
        script: |
          flutter analyze

      - name: Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
