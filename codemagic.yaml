workflows:
  android-release:
    name: AI Robot PRO v2 - Android Release APK

    environment:
      flutter: 3.35.0
      java: 17

    scripts:
      - name: Check Flutter version
        script: |
          flutter --version
          dart --version

      - name: Get packages
        script: |
          flutter clean
          flutter pub get

      - name: Analyze
        script: |
          flutter analyze

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
